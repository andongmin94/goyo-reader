name: Android
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', 'gradle/**', 'gradle.properties', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Build and lint Android
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: JVM reader tests
        timeout-minutes: 6
        run: |
          ( sleep 90; jps -l | awk '/GradleWorkerMain/ {print $1}' | while read -r pid; do jcmd "$pid" Thread.print; done ) &
          diagnostic=$!
          trap 'kill "$diagnostic" 2>/dev/null || true' EXIT
          ./gradlew :app:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android rendering and reading tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            if adb shell test -d /sdcard/Android/data/kr.goyo.reader/files/screenshots; then adb pull /sdcard/Android/data/kr.goyo.reader/files/screenshots app/build/outputs/device-screenshots; fi
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: min-viewer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/screenshots/
            app/build/outputs/device-screenshots/
          if-no-files-found: ignore
